sonar.organization=lttruk
sonar.projectKey=lttruk_Bloc3
sonar.sources=src
sonar.exclusions=**/*.spec.ts
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Fichiers sans logique métier, déjà exclus de la couverture Jest (voir package.json),
# et script de données de démonstration (prisma/seed.ts), qui ne fait pas partie de l'application.
# public/ : interface web sans framework, vérifiée par des tests manuels de parcours ; les règles métier
# qu'elle déclenche sont testées côté API (tests unitaires et e2e).
sonar.coverage.exclusions=src/main.ts,src/configuration-app.ts,**/*.module.ts,**/*.decorator.ts,**/dto/**,src/prisma/prisma.service.ts,prisma/seed.ts,public/**
# La migration initiale reprend volontairement le schéma documenté dans docs/database/schema.sql
sonar.cpd.exclusions=prisma/migrations/**,docs/**
